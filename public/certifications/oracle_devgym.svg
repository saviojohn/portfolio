<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <!-- Outer White Canvas & Red Frame -->
  <rect width="800" height="560" fill="#ffffff"/>
  <rect x="25" y="25" width="750" height="510" fill="none" stroke="#dc2626" stroke-width="4"/>
  
  <!-- Oracle Dev Gym Box Logo -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="220" height="48" fill="#dc2626" rx="2"/>
    <text x="15" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">ORACLE</text>
    <text x="108" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">Dev Gym</text>
  </g>
  
  <!-- Certificate Main Content -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <text x="0" y="30" font-family="Georgia, serif" font-size="36" font-weight="500" fill="#111827">Certificate of Excellence</text>
    
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">is presented to</text>
    
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">Savio John</text>
    
    <text x="0" y="155" font-family="Arial, sans-serif" font-size="15" fill="#111827">for receiving a grade of <tspan font-weight="bold">98%</tspan> in</text>
    
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Databases for Developers: Foundations</text>
    
    <text x="0" y="235" font-family="Arial, sans-serif" font-size="14" fill="#374151">Teacher: Chris Saxon</text>
  </g>
  
  <!-- Bottom Bar & Weightlifter Badge -->
  <g transform="translate(70, 445)">
    <rect x="0" y="0" width="560" height="50" fill="#e5e7eb" rx="25"/>
    <text x="25" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Presented by: Steven Feuerstein</text>
    <text x="25" y="38" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Founder, Oracle Dev Gym</text>
    
    <!-- Signature Line -->
    <path d="M220 30 C260 10, 310 40, 360 15 S410 30, 430 20" fill="none" stroke="#111827" stroke-width="2"/>
    <line x1="210" y1="36" x2="440" y2="36" stroke="#9ca3af" stroke-width="1.5"/>
  </g>

  <!-- Weightlifter Icon Badge -->
  <g transform="translate(680, 430)">
    <circle cx="35" cy="35" r="42" fill="#dc2626" stroke="#ffffff" stroke-width="4"/>
    <!-- Dumbbell / Weightlifter Icon -->
    <rect x="12" y="31" width="46" height="8" fill="#ffffff" rx="2"/>
    <rect x="15" y="21" width="8" height="28" fill="#ffffff" rx="2"/>
    <rect x="47" y="21" width="8" height="28" fill="#ffffff" rx="2"/>
  </g>
</svg>
