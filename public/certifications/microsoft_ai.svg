<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="560" fill="#ffffff"/>
  
  <!-- Microsoft Header Logo -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="14" height="14" fill="#f25022"/>
    <rect x="17" y="0" width="14" height="14" fill="#7fba00"/>
    <rect x="0" y="17" width="14" height="14" fill="#00a4ef"/>
    <rect x="17" y="17" width="14" height="14" fill="#ffb900"/>
    <text x="40" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#505050">Microsoft</text>
  </g>
  
  <!-- Partner Logos -->
  <g transform="translate(530, 45)">
    <text x="0" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#666">futureskills</text>
    <text x="95" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" fill="#d9383a">NASSCOM</text>
    <text x="185" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#00a4ef">prime</text>
  </g>
  
  <!-- Center Body -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <!-- Decorative Title Accent -->
    <line x1="-160" y1="20" x2="-100" y2="20" stroke="#1e3a8a" stroke-width="2"/>
    <text x="0" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#1e3a8a" letter-spacing="4">CERTIFICATE</text>
    <line x1="100" y1="20" x2="160" y2="20" stroke="#1e3a8a" stroke-width="2"/>
    
    <text x="0" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="900" fill="#111827" letter-spacing="2">SAVIO JOHN</text>
    
    <text x="0" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b7280" letter-spacing="1.5">PARTICIPATED IN</text>
    <text x="0" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" fill="#d9383a">Microsoft AI Classroom Series</text>
  </g>
  
  <!-- Signatures and Issue Date -->
  <g transform="translate(50, 440)">
    <text x="0" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#111">29-01-2021</text>
    <line x1="0" y1="22" x2="110" y2="22" stroke="#111" stroke-width="1.5"/>
    <text x="0" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280">Date of issue</text>
  </g>
  
  <g transform="translate(400, 420)" text-anchor="middle">
    <path d="M-50 15 C-20 0, 20 30, 50 10" fill="none" stroke="#111" stroke-width="2"/>
    <text x="0" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#111">Rohini Srivathsa</text>
    <text x="0" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b7280">National Technology Officer, Microsoft India</text>
  </g>
  
  <g transform="translate(680, 420)" text-anchor="middle">
    <path d="M-50 15 C-20 5, 20 25, 50 12" fill="none" stroke="#111" stroke-width="2"/>
    <text x="0" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#111">Amit Aggarwal</text>
    <text x="0" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b7280">CEO IT ITeS SSC, NASSCOM</text>
  </g>
  
  <!-- Bottom Cyan/Blue Accent Swoosh -->
  <path d="M0 500 L800 520 L800 560 L0 560 Z" fill="#0284c7"/>
  <path d="M0 525 L800 540 L800 560 L0 560 Z" fill="#0f172a"/>
</svg>
